<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doston Ki Mehfil — Doston ki Chat</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { font-family:'Segoe UI', Roboto, Arial, sans-serif; background:#0b141a; color:#e9edef; display:flex; flex-direction:column; height:100dvh; }
  .hidden { display:none !important; }

  /* ---------- Auth screen ---------- */
  #authScreen { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(160deg,#075e54,#0b141a 70%); overflow-y:auto; }
  .auth-card { background:#1f2c34; border-radius:16px; padding:28px 22px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .auth-card .logo { font-size:44px; text-align:center; }
  .auth-card h1 { text-align:center; font-size:22px; margin:8px 0 2px; color:#fff; }
  .auth-card p.sub { text-align:center; color:#aebac1; font-size:13px; margin-bottom:20px; }
  .auth-card label { display:block; font-size:12px; color:#aebac1; margin:12px 0 5px; }
  .auth-card input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #2a3942; background:#2a3942; color:#fff; font-size:15px; outline:none; }
  .auth-card input:focus { border-color:#00a884; }
  .auth-btn { width:100%; margin-top:20px; padding:13px; border:none; border-radius:24px; background:#00a884; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .auth-btn:disabled { opacity:.55; }
  .toggle-line { text-align:center; margin-top:16px; font-size:13.5px; color:#aebac1; }
  .toggle-line a { color:#53bdeb; cursor:pointer; text-decoration:none; font-weight:600; }
  .err { background:#3b1d22; color:#ff8a94; border:1px solid #5c2b33; border-radius:8px; padding:9px 12px; font-size:13px; margin-top:14px; display:none; }
  .note { text-align:center; color:#8696a0; font-size:12px; margin-top:14px; line-height:1.5; }

  /* ---------- Chat screen ---------- */
  #chatScreen { flex:1; display:flex; flex-direction:column; height:100dvh; }
  header { background:#1f2c34; padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 1px 4px rgba(0,0,0,.4); z-index:2; }
  header .avatar { width:40px; height:40px; border-radius:50%; background:#00a884; display:flex; align-items:center; justify-content:center; font-size:20px; flex:none; }
  header .htext { flex:1; min-width:0; }
  header h2 { font-size:16.5px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .online-line { font-size:12px; color:#aebac1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .online-line b { color:#25d366; font-weight:600; }
  #logoutBtn { background:none; border:1px solid #2a3942; color:#aebac1; border-radius:16px; padding:6px 12px; font-size:12.5px; cursor:pointer; flex:none; }
  #membersBar { background:#182229; padding:6px 14px; font-size:12.5px; color:#aebac1; display:flex; gap:12px; flex-wrap:wrap; border-bottom:1px solid #222d34; }
  #membersBar .m { display:flex; align-items:center; gap:5px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#8696a0; display:inline-block; }
  .dot.on { background:#25d366; }
  #messages { flex:1; overflow-y:auto; padding:14px 10px 8px; background:#0b141a url(''); display:flex; flex-direction:column; gap:3px; }
  .day-note { align-self:center; background:#182229; color:#aebac1; font-size:11.5px; padding:5px 12px; border-radius:8px; margin:8px 0; }
  .row { display:flex; margin-top:2px; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:78%; padding:7px 10px 5px; border-radius:10px; font-size:14.5px; line-height:1.45; color:#e9edef; background:#1f2c34; box-shadow:0 1px 1px rgba(0,0,0,.35); word-wrap:break-word; }
  .row.me .bubble { background:#005c4b; border-top-right-radius:2px; }
  .row.other .bubble { border-top-left-radius:2px; }
  .bubble .sender { font-size:12px; font-weight:700; color:#53bdeb; margin-bottom:2px; }
  .bubble .meta { float:right; font-size:10.5px; color:#aebac1; margin:8px 0 0 10px; }
  .bubble audio { width:210px; height:36px; margin-top:2px; }
  .sys { align-self:center; background:#182229; color:#ffd279; font-size:12px; padding:5px 12px; border-radius:8px; margin:6px 0; }
  #inputBar { display:flex; align-items:flex-end; gap:7px; padding:8px; background:#0b141a; }
  #msgInput { flex:1; border:none; border-radius:24px; background:#1f2c34; color:#fff; padding:12px 16px; font-size:15px; outline:none; resize:none; max-height:110px; font-family:inherit; }
  .round-btn { width:48px; height:48px; border-radius:50%; border:none; background:#00a884; color:#fff; font-size:20px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; }
  #micBtn.recording { background:#ea0038; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); } }
  #recBar { display:none; align-items:center; gap:10px; background:#1f2c34; margin:0 8px 6px; padding:10px 14px; border-radius:12px; font-size:14px; }
  #recBar .rec-dot { width:10px; height:10px; border-radius:50%; background:#ea0038; animation:pulse 1s infinite; }
  #recBar button { border:none; border-radius:16px; padding:7px 14px; font-size:13px; cursor:pointer; }
  #recCancel { background:#2a3942; color:#e9edef; }
  #recSend { background:#00a884; color:#fff; font-weight:600; }
  .empty-note { text-align:center; color:#8696a0; font-size:13.5px; margin-top:34px; line-height:1.7; padding:0 30px; }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="authScreen">
  <div class="auth-card">
    <div class="logo">🍿</div>
    <h1>Doston Ki Mehfil</h1>
    <p class="sub">Doston ki apni chat — WhatsApp style</p>

    <div id="nameField">
      <label>Apna naam (jo chat mein nazar aayega)</label>
      <input id="nameInput" type="text" placeholder="e.g. Malik" maxlength="30" autocomplete="name">
    </div>
    <label>Email</label>
    <input id="emailInput" type="email" placeholder="aapka@email.com" autocomplete="email">
    <label>Password</label>
    <input id="passInput" type="password" placeholder="Kam az kam 6 characters" autocomplete="current-password">

    <div class="err" id="authErr"></div>
    <button class="auth-btn" id="authBtn">Account banayein</button>
    <div class="toggle-line" id="toggleLine">Pehle se account hai? <a id="toggleLink">Login karein</a></div>
    <div class="note">Ek dafa login karne ke baad dobara login nahi karna parega —<br>app aap ko khud pehchan legi. Messages hamesha mehfooz rahte hain. 🔒</div>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div id="chatScreen" class="hidden">
  <header>
    <div class="avatar">🍿</div>
    <div class="htext">
      <h2>Doston Ki Mehfil</h2>
      <div class="online-line" id="onlineLine">connect ho raha hai…</div>
    </div>
    <button id="logoutBtn">Logout</button>
  </header>
  <div id="membersBar"></div>
  <div id="messages"></div>
  <div id="recBar">
    <span class="rec-dot"></span><span id="recTime">0:00</span><span style="flex:1">Recording ho rahi hai…</span>
    <button id="recCancel">Cancel</button>
    <button id="recSend">Bhejein ➤</button>
  </div>
  <div id="inputBar">
    <textarea id="msgInput" rows="1" placeholder="Message likhein…"></textarea>
    <button class="round-btn" id="micBtn" title="Voice message">🎤</button>
    <button class="round-btn" id="sendBtn" title="Bhejein">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";
  var firebaseConfig = {
    apiKey: "AIzaSyB85yUOhAAy-WCxsPclzqPB5aGvrvpXaTY",
    authDomain: "doston-ki-mehfil-43a7a.firebaseapp.com",
    projectId: "doston-ki-mehfil-43a7a",
    storageBucket: "doston-ki-mehfil-43a7a.firebasestorage.app",
    messagingSenderId: "674015998331",
    appId: "1:674015998331:web:cb6397ef8eda3114710dde"
  };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var ROOM = (new URLSearchParams(location.search).get('room') || 'doston786').replace(/[^a-zA-Z0-9_-]/g,'') || 'doston786';

  var $ = function(id){ return document.getElementById(id); };
  var authScreen=$('authScreen'), chatScreen=$('chatScreen'), messagesEl=$('messages');
  var mode = 'signup'; // or 'login'
  var me = null, myName = '';
  var unsubMsg = null, unsubUsers = null, presenceTimer = null;
  var lastMsgCount = 0;

  /* ---------- Auth UI ---------- */
  function setMode(m){
    mode = m;
    $('nameField').style.display = (m==='signup') ? 'block' : 'none';
    $('authBtn').textContent = (m==='signup') ? 'Account banayein' : 'Login karein';
    $('toggleLine').innerHTML = (m==='signup')
      ? 'Pehle se account hai? <a id="toggleLink">Login karein</a>'
      : 'Account nahi hai? <a id="toggleLink">Naya account banayein</a>';
    $('toggleLink').onclick = function(){ setMode(mode==='signup' ? 'login' : 'signup'); hideErr(); };
    $('passInput').setAttribute('autocomplete', m==='signup' ? 'new-password' : 'current-password');
  }
  function showErr(t){ var e=$('authErr'); e.textContent=t; e.style.display='block'; }
  function hideErr(){ $('authErr').style.display='none'; }
  function friendlyErr(code){
    if(!code) return 'Kuch ghalat ho gaya, dobara koshish karein.';
    if(code.indexOf('email-already-in-use')>-1) return 'Ye email pehle se registered hai — Login karein.';
    if(code.indexOf('wrong-password')>-1 || code.indexOf('invalid-credential')>-1) return 'Email ya password ghalat hai.';
    if(code.indexOf('user-not-found')>-1) return 'Is email ka account nahi mila — pehle account banayein.';
    if(code.indexOf('weak-password')>-1) return 'Password kam az kam 6 characters ka rakhein.';
    if(code.indexOf('invalid-email')>-1) return 'Email sahi likhein.';
    if(code.indexOf('network')>-1) return 'Internet ka masla hai — connection check karke dobara koshish karein.';
    return 'Masla: ' + code;
  }

  $('authBtn').onclick = function(){
    hideErr();
    var email = $('emailInput').value.trim();
    var pass = $('passInput').value;
    var name = $('nameInput').value.trim();
    if(!email || !pass){ showErr('Email aur password dono likhein.'); return; }
    if(mode==='signup'){
      if(!name){ showErr('Apna naam likhein — wahi naam chat mein nazar aayega.'); return; }
      if(name.toLowerCase()==='mahnoor'){ showErr('Ye naam Mahnoor ke liye mehfooz hai 🍿 — apna naam likhein.'); return; }
      if(pass.length<6){ showErr('Password kam az kam 6 characters ka rakhein.'); return; }
    }
    var btn=$('authBtn'); btn.disabled=true; btn.textContent='Thoda intezar karein…';
    var p = (mode==='signup')
      ? auth.createUserWithEmailAndPassword(email, pass).then(function(cred){
          return db.collection('users').doc(cred.user.uid).set({
            name: name, email: email, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
          });
        })
      : auth.signInWithEmailAndPassword(email, pass);
    p.catch(function(e){ showErr(friendlyErr(e.code)); })
     .finally(function(){ btn.disabled=false; setMode(mode); });
  };
  $('passInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ $('authBtn').click(); } });

  /* ---------- Session ---------- */
  auth.onAuthStateChanged(function(user){
    if(user){
      me = user;
      db.collection('users').doc(user.uid).get().then(function(doc){
        myName = (doc.exists && doc.data().name) ? doc.data().name : (user.email || 'Dost');
        enterChat();
      }).catch(function(){ myName = user.email || 'Dost'; enterChat(); });
    } else {
      me = null;
      if(unsubMsg) unsubMsg();
      if(unsubUsers) unsubUsers();
      if(presenceTimer) clearInterval(presenceTimer);
      chatScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      setMode('signup');
    }
  });

  $('logoutBtn').onclick = function(){ auth.signOut(); };

  function touchPresence(){
    if(!me) return;
    db.collection('users').doc(me.uid).set({
      name: myName, email: me.email, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true}).catch(function(){});
  }

  function enterChat(){
    authScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');
    touchPresence();
    presenceTimer = setInterval(touchPresence, 25000);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) touchPresence(); });
    loadMessages();
    loadMembers();
  }

  /* ---------- Members / presence ---------- */
  function loadMembers(){
    unsubUsers = db.collection('users').onSnapshot(function(snap){
      var now = Date.now(), online = [], html = '';
      snap.forEach(function(d){
        var u = d.data();
        var seen = u.lastSeen && u.lastSeen.toMillis ? u.lastSeen.toMillis() : 0;
        var isOn = (now - seen) < 90000;
        if(isOn) online.push(u.name);
        html += '<span class="m"><span class="dot'+(isOn?' on':'')+'"></span>'+escapeHtml(u.name||'Dost')+'</span>';
      });
      $('membersBar').innerHTML = html || '<span class="m">Koi member nahi</span>';
      $('onlineLine').innerHTML = online.length
        ? '<b>' + online.map(escapeHtml).join(', ') + '</b> online'
        : 'koi online nahi';
    }, function(){});
  }

  /* ---------- Messages ---------- */
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtTime(ts){
    if(!ts) return '';
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if(h===0) h = 12;
    return h + ':' + (m<10?'0':'') + m + ' ' + ap;
  }
  function renderMsg(d){
    var m = d.data();
    var row = document.createElement('div');
    if(m.type === 'sys'){
      row.className = 'sys'; row.textContent = m.text || '';
      return row;
    }
    var mine = me && m.uid === me.uid;
    row.className = 'row ' + (mine ? 'me' : 'other');
    var inner = '<div class="bubble">';
    if(!mine) inner += '<div class="sender">' + escapeHtml(m.name || 'Dost') + '</div>';
    if(m.type === 'voice' && m.audio){
      inner += '<audio controls preload="metadata" src="' + m.audio + '"></audio>';
    } else {
      inner += '<span>' + escapeHtml(m.text || '') + '</span>';
    }
    inner += '<span class="meta">' + fmtTime(m.ts) + (mine ? ' ✓✓' : '') + '</span></div>';
    row.innerHTML = inner;
    return row;
  }
  function loadMessages(){
    var q = db.collection('rooms').doc(ROOM).collection('messages').orderBy('ts','asc').limitToLast(300);
    unsubMsg = q.onSnapshot(function(snap){
      messagesEl.innerHTML = '';
      if(snap.empty){
        messagesEl.innerHTML = '<div class="empty-note">Mehfil khaali hai 🍿<br>Pehla message bhejein — aur ye hamesha yahin rahega,<br>ghayab nahi hoga!</div>';
      }
      snap.forEach(function(d){ messagesEl.appendChild(renderMsg(d)); });
      lastMsgCount = snap.size;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, function(err){
      messagesEl.innerHTML = '<div class="empty-note">Messages load nahi ho rahe — internet check karein.</div>';
    });
  }

  function sendDoc(data){
    data.uid = me.uid; data.name = myName;
    data.ts = firebase.firestore.FieldValue.serverTimestamp();
    return db.collection('rooms').doc(ROOM).collection('messages').add(data);
  }

  /* ---------- Text sending ---------- */
  var input = $('msgInput');
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });
  input.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  $('sendBtn').onclick = doSend;
  function doSend(){
    var t = input.value.trim();
    if(!t || !me) return;
    input.value=''; input.style.height='auto';
    sendDoc({type:'text', text:t}).catch(function(){ /* snapshot will show if it lands */ });
    input.focus();
  }

  /* ---------- Voice messages ---------- */
  var mediaRec = null, chunks = [], recTimer = null, recSecs = 0, recStream = null;
  var micBtn = $('micBtn'), recBar = $('recBar');
  function fmtDur(s){ return Math.floor(s/60) + ':' + ('0' + (s%60)).slice(-2); }
  micBtn.onclick = function(){
    if(mediaRec && mediaRec.state === 'recording') return;
    if(!navigator.mediaDevices || !window.MediaRecorder){
      alert('Is browser mein voice recording support nahi hai.');
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recStream = stream; chunks = [];
      try { mediaRec = new MediaRecorder(stream, {mimeType:'audio/webm;codecs=opus'}); }
      catch(e){ mediaRec = new MediaRecorder(stream); }
      mediaRec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      mediaRec.start(250);
      recSecs = 0; $('recTime').textContent = '0:00';
      recBar.style.display = 'flex'; micBtn.classList.add('recording');
      recTimer = setInterval(function(){
        recSecs++; $('recTime').textContent = fmtDur(recSecs);
        if(recSecs >= 60) stopRec(true);
      }, 1000);
    }).catch(function(){ alert('Microphone ki ijazat dein taake voice message bhej saken.'); });
  };
  function stopRec(send){
    if(!mediaRec) return;
    var mr = mediaRec; mediaRec = null;
    clearInterval(recTimer);
    recBar.style.display = 'none'; micBtn.classList.remove('recording');
    mr.onstop = function(){
      if(recStream){ recStream.getTracks().forEach(function(t){ t.stop(); }); recStream = null; }
      if(!send) return;
      var blob = new Blob(chunks, {type: mr.mimeType || 'audio/webm'});
      var r = new FileReader();
      r.onload = function(){
        var dataUrl = r.result;
        if(typeof dataUrl === 'string' && dataUrl.length < 950000){
          sendDoc({type:'voice', audio:dataUrl, dur: recSecs});
        } else {
          alert('Voice message bohat lamba hai — chhota sa record karke bhejein.');
        }
      };
      r.readAsDataURL(blob);
    };
    mr.stop();
  }
  $('recCancel').onclick = function(){ stopRec(false); };
  $('recSend').onclick = function(){ stopRec(true); };
})();
</script>
</body>
</html>
